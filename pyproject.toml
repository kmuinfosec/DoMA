[project]
name = "doma"
version = "1.0.0"
description = "DoMA (Document Membership Attribution) — naming the confidential document an outbound payload derives from"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "pyarrow>=18.0",
    "pyyaml>=6.0",
    "scikit-learn>=1.5",
    "tqdm>=4.66",
    # DoMA: document embeddings + vector index.
    "sentence-transformers==5.3.0",
    "transformers==5.3.0",
    "tokenizers==0.22.2",
    "torch==2.11.0",
    "faiss-cpu>=1.9",
    # baselines
    "bm25s>=0.3.9",
    "ppdeep>=20200728",
    # surface-level variation quality
    "rapidfuzz>=3.9",
    # the ROC figure
    "matplotlib>=3.9",
]

[dependency-groups]
# Needed only to rebuild the datasets from source (CASIMIR download + duplicate-forum removal)
# and to regenerate DIPPER paraphrases.
data = ["datasets>=3.0", "datasketch>=1.6", "nltk>=3.9"]
dipper = ["transformers>=4.44", "bitsandbytes>=0.43", "nltk>=3.9"]
dev = ["ipykernel>=6.29"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/doma"]
