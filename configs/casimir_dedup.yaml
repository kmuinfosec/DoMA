# CASIMIR with duplicate-forum removal — the optional variant of configs/casimir_raw.yaml.
# Papers resubmitted under several forums are dropped, not merged
# (see src/doma/datasets/casimir.py).
#
#   python -m doma.cli run configs/casimir_dedup.yaml

dataset: casimir_dedup
original_set: casimir_dedup_v1_only
variant_sets:
  - casimir_dedup_latest_only

include_original_as_positive: false
split_seed: 42
split_ratio: 0.5

prepared_dir: data/prepared
splits_dir: data/splits
artifacts_dir: artifacts

runs:
  - method: doma
    params:
      model: Qwen/Qwen3-Embedding-0.6B
      dtype: bfloat16
      batch_size: 2
  - method: doma
    params:
      model: ibm-granite/granite-embedding-97m-multilingual-r2
      dtype: bfloat16
      batch_size: 4
  - method: doma
    params:
      model: BAAI/bge-base-en-v1.5
      dtype: bfloat16
      batch_size: 32

  - method: bm25
  - method: ssdeep
